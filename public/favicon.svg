<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background circle for contrast at small sizes -->
  <circle cx="50" cy="50" r="50" fill="#1a1410"/>

  <!-- Outer gold ring -->
  <circle cx="50" cy="56" r="30" fill="none" stroke="#b89a5a" stroke-width="3.5"/>

  <!-- Bold "L" letterform in gold -->
  <text
    x="50" y="75"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="44"
    font-weight="700"
    fill="#b89a5a"
    letter-spacing="-1"
  >L</text>

  <!-- Scales of justice — simplified, bold at small size -->
  <!-- Centre post -->
  <line x1="50" y1="16" x2="50" y2="28" stroke="#b89a5a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="38" y1="20" x2="62" y2="20" stroke="#b89a5a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="38" y1="20" x2="34" y2="26" stroke="#b89a5a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="62" y1="20" x2="66" y2="26" stroke="#b89a5a" stroke-width="2" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M31 26 Q34 29 37 26" fill="none" stroke="#b89a5a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M63 26 Q66 29 69 26" fill="none" stroke="#b89a5a" stroke-width="2" stroke-linecap="round"/>

  <!-- Star at top of scales -->
  <polygon
    points="50,10 51.5,14.5 56,14.5 52.5,17 54,21.5 50,19 46,21.5 47.5,17 44,14.5 48.5,14.5"
    fill="#c8a84b"
  />

  <!-- Left laurel leaf cluster (simplified bold arcs) -->
  <path d="M18 62 Q14 52 18 44" fill="none" stroke="#8b0000" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M21 66 Q13 56 17 47" fill="none" stroke="#8b0000" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 70 Q15 62 18 52" fill="none" stroke="#8b0000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right laurel leaf cluster -->
  <path d="M82 62 Q86 52 82 44" fill="none" stroke="#8b0000" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M79 66 Q87 56 83 47" fill="none" stroke="#8b0000" stroke-width="3" stroke-linecap="round"/>
  <path d="M75 70 Q85 62 82 52" fill="none" stroke="#8b0000" stroke-width="2.5" stroke-linecap="round"/>
</svg>
